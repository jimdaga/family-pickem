# Default values for family-pickem.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: familypickem/pickem-django
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

app:
  env: {} 
    # DJANGO_DEBUG: "False"
    # SECRET_KEY: "" # You must set this 
    # DJANGO_ALLOWED_HOSTS: "example.com"
    # DATABASE_HOST: ""
    # DATABASE_USER: ""
    # DATABASE_NAME: ""
    # DATABASE_PASS: ""
    # DATABASE_PORT: ""

postgresql:
  enabled: true
  global:
    postgresql:
      auth:
        # postgresPassword: ""
        # username: ""
        # password: ""
        database: "pickem"

# Shared Redis: the Django cache now, and the pub/sub broker for live updates
# later (#93). Self-managed (NOT the Bitnami subchart — Bitnami deprecated its
# free catalog in Aug 2025). Disabled by default; enabled per environment in
# infra/app/. Ephemeral: no persistence, since it is only a cache/broker.
# Reachable only inside the cluster network, so it runs without auth; add auth
# (a password from AWS Secrets Manager via ESO) before ever exposing it.
redis:
  enabled: false
  image: "redis:7.4-alpine"
  # Bound the dataset (maxmemory) below the container limit and evict LRU keys
  # so Redis can never OOM the node. Keep maxmemory well under resources.limits
  # memory to leave headroom for the Redis process + fragmentation.
  maxmemory: "180mb"
  maxmemoryPolicy: "allkeys-lru"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Dedicated scheduler Deployment (see templates/scheduler-deployment.yaml).
# When enabled, runs the update pipeline in its own single-replica pod
# (RUN_SCHEDULER=true); the web tier always runs RUN_SCHEDULER=false and can
# therefore autoscale.
scheduler:
  enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

# The legacy update-data CronJob (cron.sh) was replaced by the in-process
# APScheduler `update_all` pipeline (scheduler.enabled). Template removed.

healthchecks:
  enabled: true 

# Web container resources. requests.cpu is REQUIRED for the CPU-target HPA to
# compute utilization. No CPU limit so pods can burst.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75
  # targetMemoryUtilizationPercentage: 80

# pickemctl retired — userStats is computed in-process by the `update_stats`
# management command (part of the update_all pipeline).

externalSecrets:
  enabled: false
  clusterSecretStore: aws-secrets-manager
  envvarsKey: ""
  # A separate, least-privilege secret for the private family-logo S3 prefix.
  # Leave blank to omit both its ExternalSecret and Deployment injection.
  logoStorageKey: ""

backup:
  enabled: false
  schedule: "0 2 * * *"
  s3Bucket: family-pickem-backups
  s3Prefix: postgres
  keepCount: 5
  image: "postgres:15"

nodeSelector: {}

tolerations: []

affinity: {}
