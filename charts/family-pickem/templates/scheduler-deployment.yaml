{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "family-pickem.fullname" . }}-scheduler
  labels:
    {{- include "family-pickem.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  # Exactly one scheduler ever: single replica + Recreate guarantees a single
  # writer to the APScheduler DjangoJobStore (preserves max_instances=1).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "family-pickem.name" . }}-scheduler
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "family-pickem.name" . }}-scheduler
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: scheduler
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "family-pickem.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        # The web Deployment owns migrations. The scheduler waits for them so
        # the two Deployments never race to migrate on a deploy.
        - name: {{ .Chart.Name }}-wait-migrations
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - 'until python manage.py migrate --check; do echo "waiting for migrations"; sleep 2; done'
          envFrom:
          - secretRef:
              name: {{ include "family-pickem.fullname" . }}-envvars
          {{- if and .Values.externalSecrets.enabled .Values.externalSecrets.logoStorageKey }}
          - secretRef:
              name: {{ include "family-pickem.fullname" . }}-logo-storage
          {{- end }}
          env:
          - name: THIS_POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          {{- if .Values.redis.enabled }}
          - name: REDIS_URL
            value: "redis://{{ include "family-pickem.fullname" . }}-redis:6379/1"
          {{- end }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
      containers:
        - name: {{ .Chart.Name }}-scheduler
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
          - secretRef:
              name: {{ include "family-pickem.fullname" . }}-envvars
          {{- if and .Values.externalSecrets.enabled .Values.externalSecrets.logoStorageKey }}
          - secretRef:
              name: {{ include "family-pickem.fullname" . }}-logo-storage
          {{- end }}
          env:
          - name: THIS_POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: APP_RELEASE
            value: "{{ .Values.image.tag | default .Chart.AppVersion }}"
          # This pod IS the scheduler: it runs the in-process APScheduler pipeline.
          # PickemApiConfig.ready() starts the scheduler only when RUN_SCHEDULER
          # AND RUN_WEB_SERVER are true under `manage.py runserver` (RUN_MAIN is
          # set by runserver's reloader child). The image entrypoint already
          # exports RUN_WEB_SERVER=true before runserver; we set it explicitly
          # here too so the scheduler's start condition never silently depends on
          # entrypoint internals (a mis-set value would pass health probes while
          # running no pipeline).
          - name: RUN_SCHEDULER
            value: "true"
          - name: RUN_WEB_SERVER
            value: "true"
          {{- if .Values.redis.enabled }}
          - name: REDIS_URL
            value: "redis://{{ include "family-pickem.fullname" . }}-redis:6379/1"
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- if .Values.healthchecks.enabled }}
          livenessProbe:
            httpGet:
              path: /livez/
              port: http
            initialDelaySeconds: 25
          readinessProbe:
            httpGet:
              path: /healthz/
              port: http
            initialDelaySeconds: 25
          {{- end }}
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
