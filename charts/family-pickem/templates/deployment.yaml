apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "family-pickem.fullname" . }}
  labels:
    {{- include "family-pickem.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "family-pickem.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "family-pickem.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "family-pickem.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: {{ .Chart.Name }}-migrate
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          envFrom:
          - secretRef:
              name: {{ include "family-pickem.fullname" . }}-envvars
          {{- if and .Values.externalSecrets.enabled .Values.externalSecrets.logoStorageKey }}
          - secretRef:
              name: {{ include "family-pickem.fullname" . }}-logo-storage
          {{- end }}
          env:
          - name: THIS_POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
          - secretRef:
              name: {{ include "family-pickem.fullname" . }}-envvars
          {{- if and .Values.externalSecrets.enabled .Values.externalSecrets.logoStorageKey }}
          - secretRef:
              name: {{ include "family-pickem.fullname" . }}-logo-storage
          {{- end }}
          env:
          - name: THIS_POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
          - name: APP_RELEASE
            value: "{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- if .Values.redis.enabled }}
          # Shared Redis cache/broker (self-managed; see templates/redis.yaml).
          # REDIS_PASSWORD (from the -envvars secret via ESO) is interpolated into
          # REDIS_URL by Kubernetes at pod start, so the credential never appears
          # in a rendered manifest. DB 1 is the Django cache; later phases use
          # other DB indexes for pub/sub.
          - name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ include "family-pickem.fullname" . }}-envvars
                key: REDIS_PASSWORD
          - name: REDIS_URL
            value: "redis://:$(REDIS_PASSWORD)@{{ include "family-pickem.fullname" . }}-redis:6379/1"
          {{- end }}
          # The web tier never runs the pipeline — the dedicated scheduler
          # Deployment does (templates/scheduler-deployment.yaml). Explicit
          # RUN_SCHEDULER=false so the web pods stay stateless and can autoscale.
          - name: RUN_SCHEDULER
            value: "false"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- if .Values.healthchecks.enabled }}
          livenessProbe:
            httpGet:
              path: /livez/
              port: http
            initialDelaySeconds: 25
          readinessProbe:
            httpGet:
              path: /healthz/
              port: http
            initialDelaySeconds: 25
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
