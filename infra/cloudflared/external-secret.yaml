# Cloudflare Tunnel token (remotely-managed tunnel "family-pickem").
# Prerequisite: plaintext secret family-pickem/cloudflared/tunnel-token in AWS Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel-token
  namespace: cloudflared
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: cloudflared-tunnel-token
  data:
    - secretKey: token
      remoteRef:
        key: family-pickem/cloudflared/tunnel-token
