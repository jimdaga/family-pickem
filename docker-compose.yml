version: "3.8" 

services:
  # Redis cache for rate limiting (uncomment for production)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - '6379:6379'
  #   networks:
  #     - django
  #   restart: unless-stopped

  postgresql:
    image: docker.io/bitnami/postgresql:15
    ports:
      - '5432:5432'
    volumes:
      - 'postgresql_data:/bitnami/postgresql'
      - './docker/postgres/init:/docker-entrypoint-initdb.d'
    expose:
      - 5432/tcp
    networks:
      - django
    environment:
      # Set POSTGRES_PASSWORD in your shell or a top-level .env file before
      # running `docker-compose up`. An empty DB password is reachable from
      # any container on the `django` network.
      - 'POSTGRESQL_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (see docker-compose.yml)}'
    restart: unless-stopped

  django:
    container_name: familypickem_django
    image: docker-django-v0.0
    # image: familypickem/pickem-django:0.0.5
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    # platform: "linux/amd64"
    env_file:
      - .env.app
    environment:
      # Overrides whatever DATABASE_PASS is set to in .env.app, so the
      # django and postgresql services can never drift out of sync on the
      # DB password (env_file values are overridden by environment: keys).
      - 'DATABASE_PASS=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (see docker-compose.yml)}'
    expose:
      - 8000/tcp
    ports:
      - "8000:8000"
    networks:
      - django
    depends_on:
      - postgresql
    restart: unless-stopped

volumes:
  postgresql_data:
    driver: local

networks:
  django:
    name: django
